{{define "content"}}
{{if .Cockpit}}
<link rel="canonical" href="{{.Cockpit.CanonicalURL}}">
<div class="cockpit-grid">
  <nav aria-label="Project" class="project-nav">
    <ul>
      <li><a href="/projects/{{.Cockpit.Project.ID}}">Overview</a></li>
      <li><a href="/projects/{{.Cockpit.Project.ID}}/crew" {{if eq .ActiveSection "crew"}}aria-current="page"{{end}}>Crew</a></li>
      <li><a href="/projects/{{.Cockpit.Project.ID}}#work">Work</a></li>
      <li><a href="/projects/{{.Cockpit.Project.ID}}/deliverables" {{if eq .ActiveSection "deliverables"}}aria-current="page"{{end}}>Deliverables</a></li>
      <li><a href="/projects/{{.Cockpit.Project.ID}}/reviews" {{if eq .ActiveSection "reviews"}}aria-current="page"{{end}}>Reviews</a></li>
      <li><a href="/projects/{{.Cockpit.Project.ID}}/decisions" {{if eq .ActiveSection "decisions"}}aria-current="page"{{end}}>Decisions</a></li>
      <li><a href="/projects/{{.Cockpit.Project.ID}}/documents" {{if eq .ActiveSection "documents"}}aria-current="page"{{end}}>Documents</a></li>
      <li><a href="/projects/{{.Cockpit.Project.ID}}/activity" {{if eq .ActiveSection "activity"}}aria-current="page"{{end}}>Activity</a></li>
    </ul>
  </nav>
  <div>
    <h1>{{.Cockpit.Project.Name}}: {{.Heading}}</h1>
    <p>{{.Message}}</p>
  </div>
</div>
{{else}}
<h1>{{.Heading}}</h1>
<p>{{.Message}}</p>
{{end}}
{{end}}
