current_project = "worklode"
project_key = "WL"

[gate]
paths = [
  "internal/api/router.go",
  "internal/api/authz.go",
  "internal/model/**",
  "deploy/base/**",
  "internal/hooks/**",
  "internal/watcher/**",
  "internal/eventbus/**",
  "ns/*.ttl",
  "plugins/**/skills/**",
  "plugins/**/commands/**",
]
regex = [
  # internal/cmd/** except _test.go
  '^internal/cmd/(.*/)?[^/]*([^t]|[^s]t|[^e]st|[^t]est|[^_]test)\.go$',
  # state machines and ranking in the store
  '^internal/store/(tasks|taskblockers|taskkind|leases|ranking|planlifecycle|approvalflow|escalate|sweeper)\.go$',
]
# A change to a guarded path carries one trailer naming a rule (WL-REQ-7):
#   Spec: WL-REQ-456            satisfies this rule as written
#   Spec: WL-REQ-456 amended    this rule was amended for this change
#   Spec: none refactor         fix needs a rule; refactor, perf, copy, tests, build, config
# A section value (WL-SPEC-72 sec-4) is refused; `lode show <doc>#sec-N`
# names the rule at that section.
trailer = "Spec:"
# Added lines here are skipped by the rule-ref citation test (WL-REQ-1791):
# code that parses or renders section anchors, and its tests and fixtures.
exempt = [
  "internal/designdoc/**",
  "internal/gate/**",
  "**/testdata/**",
]
