repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      # Specs and plans live in the backbone, not the tree (055). The five hooks
      # that used to lint docs/specs and docs/plans went with them; the server
      # enforces the same rules on write, through `lode doc new` and `lode doc
      # edit`.
      # always_run: a rebase can create a collision in a commit that touches no
      # migration at all, so matching on changed files would miss it.
      - id: migration-numbers
        name: one migration per number
        entry: scripts/check-migrations.sh
        language: script
        pass_filenames: false
        always_run: true
      # Rewrites like inlined-specs above: internal/ns/gen.go is a function of
      # ns/concept.ttl, so the author who edits the Turtle should get the Go
      # regenerated for them rather than a CI failure. Stdlib only, so there is
      # nothing to install before the hook can run.
      - id: ns-codegen
        name: ns concept codegen
        entry: scripts/nsgen.py
        language: script
        files: ^ns/concept\.ttl$
        pass_filenames: false
      # The Codex manifests are generated from the Claude ones. Checking rather
      # than rewriting: an author who edited the generated file by hand should
      # be told, not silently overwritten.
      - id: codex-marketplace
        name: codex marketplace mirrors claude
        entry: scripts/sync-codex-marketplace.py --check
        language: script
        pass_filenames: false
        files: ^(\.claude-plugin/|\.agents/|plugins/)
