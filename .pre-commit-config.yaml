repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      # Specs and plans live in the backbone, not the tree (055). The five hooks
      # that used to lint docs/specs and docs/plans went with them; the server
      # enforces the same rules on write, through `lode doc add` and `lode doc
      # edit`.
      # always_run: a rebase can create a collision in a commit that touches no
      # migration at all, so matching on changed files would miss it.
      - id: migration-numbers
        name: one migration per number
        entry: scripts/check-migrations.sh
        language: script
        pass_filenames: false
        always_run: true
      # Rewrites like inlined-specs above: internal/ns/gen.go is a function of
      # ns/*.ttl and nsgen.py, so the author who edits either should get the Go
      # regenerated for them rather than a CI failure. Stdlib only, so there is
      # nothing to install before the hook can run.
      - id: ns-codegen
        name: ns codegen
        entry: scripts/nsgen.py
        language: script
        files: ^(ns/(concept|ontology|task-kinds)\.ttl|scripts/nsgen\.py)$
        pass_filenames: false
      # The Codex manifests are generated from the Claude ones. Checking rather
      # than rewriting: an author who edited the generated file by hand should
      # be told, not silently overwritten.
      - id: codex-marketplace
        name: codex marketplace mirrors claude
        entry: scripts/sync-codex-marketplace.py --check
        language: script
        pass_filenames: false
        files: ^(\.claude-plugin/|\.agents/|plugins/)
      # The embedding image tag is written in five files; the Dockerfile's model
      # and TEI base decide what it must be. CI runs it through make test-scripts.
      - id: embeddings-version
        name: embedding image tag matches its Dockerfile
        entry: scripts/check-embeddings-version.sh
        language: script
        pass_filenames: false
        files: ^(deploy/embeddings\.Dockerfile|deploy/base/embeddings(-query)?\.yaml|docker-compose\.yml|\.github/workflows/build-embeddings-image\.yml)$
      # CI's spec gate, before a push: commit messages exist by then, so the
      # Spec: trailer check runs alongside the citation check. Install once
      # with `pre-commit install -t pre-push`; `lode install` manages the
      # pre-commit hook, not this one.
      - id: spec-gate
        name: spec gate
        entry: scripts/spec-gate.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
