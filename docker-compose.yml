services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ["migrate", "--dsn", "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable", "--migrations-path", "/migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/base/migrations:/migrations:ro

  worklode:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Loopback-only by default: the web board has no auth (bearer tokens
      # cover /api/v1 only). Change to "8080:8080" — or put a TLS-terminating
      # reverse proxy in front — to expose it; see README "Network exposure".
      - "127.0.0.1:8080:8080"
    environment:
      LODE_DSN: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      # ${VAR:-} passes the var through when set on the host, empty otherwise.
      # LODE_BOOTSTRAP_TOKEN must be set on first run to create the admin actor;
      # see README "Quickstart".
      LODE_BOOTSTRAP_TOKEN: ${LODE_BOOTSTRAP_TOKEN:-}
      LODE_GITHUB_WEBHOOK_SECRET: ${LODE_GITHUB_WEBHOOK_SECRET:-}
      LODE_FLUX_WEBHOOK_SECRET: ${LODE_FLUX_WEBHOOK_SECRET:-}
      LODE_CLUSTER_ENV_MAP: ${LODE_CLUSTER_ENV_MAP:-}
      LODE_BRANCH_TEMPLATE: ${LODE_BRANCH_TEMPLATE:-}
      LODE_SKILL_SOURCES: ${LODE_SKILL_SOURCES:-}
      LODE_EMBEDDING_URL: ${LODE_EMBEDDING_URL:-}
      LODE_EMBEDDING_MODEL: ${LODE_EMBEDDING_MODEL:-}
      LODE_EMBEDDING_API_KEY: ${LODE_EMBEDDING_API_KEY:-}
      LODE_SKILL_SCORE_FLOOR: ${LODE_SKILL_SCORE_FLOOR:-}
    restart: unless-stopped
    # No healthcheck: the image is distroless (no shell, no curl/wget), so
    # there is no in-container binary to run an HTTP probe with. /healthz and
    # /metrics live on the admin port (:9090), which compose does not publish;
    # add a "127.0.0.1:9090:9090" port mapping to probe liveness from the host.
