services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # A named volume, not a ./data bind mount: Postgres chowns its data
      # directory to uid 999 mode 0700, and a directory the developer cannot
      # read inside the checkout breaks every `go vet ./...` and `go build
      # ./...` on the host — Go walks it and stops on the permission error.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    entrypoint: ["/lode-migrate"]
    command: ["--dsn", "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable", "--migrations-path", "/migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/base/migrations:/migrations:ro

  worklode:
    build: .
    entrypoint: ["/lode-server"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Loopback-only by default: the web board has no auth here because this
      # file sets LODE_WEB_OPEN below (bearer tokens cover /api/v1 only). To
      # expose the port, configure LODE_OIDC_* and drop LODE_WEB_OPEN rather
      # than only changing this to "8080:8080" — a server without either
      # refuses to serve web pages at all. See README "Network exposure".
      - "127.0.0.1:8080:8080"
    environment:
      LODE_DSN: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      # ${VAR:-} passes the var through when set on the host, empty otherwise.
      # LODE_BOOTSTRAP_TOKEN must be set on first run to create the admin actor;
      # see README "Quickstart".
      LODE_BOOTSTRAP_TOKEN: ${LODE_BOOTSTRAP_TOKEN:-}
      # The local stack configures no OIDC, so the cockpit would otherwise
      # refuse to serve. Compose is a trusted-network deployment by
      # definition; a real one configures LODE_OIDC_* instead.
      LODE_WEB_OPEN: ${LODE_WEB_OPEN:-1}
      LODE_GITHUB_WEBHOOK_SECRET: ${LODE_GITHUB_WEBHOOK_SECRET:-}
      LODE_FLUX_WEBHOOK_SECRET: ${LODE_FLUX_WEBHOOK_SECRET:-}
      LODE_CATALOG_WEBHOOK_SECRET: ${LODE_CATALOG_WEBHOOK_SECRET:-}
      LODE_CLUSTER_ENV_MAP: ${LODE_CLUSTER_ENV_MAP:-}
      # The local stack is a dev instance (039 §3): it re-seeds and discards
      # data, so a delete does not have to carry a justification.
      LODE_INSTANCE_ENV: ${LODE_INSTANCE_ENV:-dev}
      LODE_BRANCH_TEMPLATE: ${LODE_BRANCH_TEMPLATE:-}
      LODE_SKILL_SOURCES: ${LODE_SKILL_SOURCES:-}
      LODE_EMBEDDING_URL: ${LODE_EMBEDDING_URL:-}
      LODE_EMBEDDING_MODEL: ${LODE_EMBEDDING_MODEL:-}
      LODE_EMBEDDING_API_KEY: ${LODE_EMBEDDING_API_KEY:-}
    restart: unless-stopped
    # No healthcheck: the image is distroless (no shell, no curl/wget), so
    # there is no in-container binary to run an HTTP probe with. /healthz and
    # /metrics live on the admin port (:9090), which compose does not publish;
    # add a "127.0.0.1:9090:9090" port mapping to probe liveness from the host.

  # SPARQL endpoint for knowledge-graph integration tests only (the production
  # write path is internal/graphserver; Oxigraph stands in for validation).
  # Pinned, not :latest, so a local run and a CI run load ns/ into the same
  # parser. A named volume rather than a ./data bind mount, for the reason the
  # postgres service above spells out.
  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:0.5.9
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - oxigraph-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  oxigraph-data:
