    allow_dropped_ids:
      "http://localhost:8000": >-
        Deliberate drop, not a source-side artifact: 001 sec-2 registers
        this fixed CLI-callback redirect URI on the Keycloak client, but
        under 031 (folded sec-8) the server performs the final loopback
        redirect, the CLI binds an ephemeral port, and the loopback URI
        needs no pre-registration -- the fixed-port CLI URIs are dead
        client config the folded document does not carry forward. The web
        callback URIs in the same list stay.
      "http://localhost:18000": >-
        Same as http://localhost:8000: the second fixed CLI-callback port
        of the pre-031 flow, dead client config under the ephemeral-port
        loopback.
      # The three wl-login entries below correct a spec-vs-code drift the
      # fold surfaced: 031 spells the CLI discovery endpoint
      # /.well-known/wl-login in all four of its mentions, and the shipped
      # route has always been /.well-known/lode-login -- server.go's
      # registration, router.go's guard table, internal/cli/login.go's
      # request and every test agree. The wire protocol is the authority
      # over the prose describing it, so the folded document carries the
      # shipped spelling. Nothing is lost: the endpoint, its payload and
      # its 404 behaviour are unchanged, only the path is spelled the way
      # a client must actually spell it. docs/specs/031 is left untouched
      # per the migration's constraint; part 5 deletes it.
      "well-known/wl-login": >-
        Corrected to well-known/lode-login (031 sec-1's step-1 trace).
      "GET /.well-known/wl-login": >-
        Corrected to GET /.well-known/lode-login (031 sec-2.1's endpoint
        heading).
      "/.well-known/wl-login": >-
        Corrected to /.well-known/lode-login (031 sec-6's added-routes
        list and its e2e fake-server bullet).
      # The three entries below enact one human ruling, made on 2026-08-13
      # after the fold surfaced the contradiction the corpus had carried
      # since 023: OIDC (Keycloak) is the only login, and a user's GitHub
      # account is linked from the identity the OIDC provider already knows,
      # on first login. GitHub is never a login provider on its own. 031
      # predates 023 and still described a provider chooser; 023 removed it
      # but never retracted 031's text, and no supersession edge connects
      # them. The shipped code has always agreed with the ruling --
      # internal/api/cliauth.go serves providers: ["keycloak"] and 404s on
      # s.oidc == nil alone -- so the fold states the design the corpus and
      # the implementation already had, rather than deciding it.
      "chooser": >-
        Dead surface: the provider chooser existed only while GitHub was a
        second login provider. 023 removed /auth/choose (folded sec-3 lists
        it among the removals) and the ruling above confirms it. Nothing
        is lost; no chooser can exist with one provider.
      "s.oidc == nil && s.gh == nil": >-
        Retired condition: discovery 404s when no interactive provider is
        configured, and after 023 the only one is OIDC, so the guard is
        `s.oidc == nil`. The `s.gh` half tested for the GitHub login
        provider the ruling above confirms does not exist. Matches
        internal/api/cliauth.go's wellKnownLogin.
      '{ "authorize_url": "{public}/auth/cli/login", "token_url": "{public}/auth/cli/token", "providers": ["github"] }': >-
        Same ruling: the discovery payload advertised GitHub as the login
        provider. The folded text carries the identical payload with
        providers: ["keycloak"], which is what internal/api/cliauth.go has
        always served. Only the provider name changed; both URLs survive.
      "docs/plans/2026-07-20-provider-neutral-cli-login-design.md": >-
        Deliberate drop, not a source-side artifact: 031 sec-0 opens with a
        blockquote recording that 031 was promoted from this plan. The
        folded document has four sources and was promoted from nothing, so
        the note states a history that is no longer its own; the promotion
        is recorded in mapping.yaml and in git. The path is also already
        dangling -- docs/plans/ has 2026-07-20-provider-neutral-cli-login.md
        and never had the -design suffix.
      "docs/authoring-design-docs.md": >-
        Same blockquote as the entry above: the file is cited there as the
        authority for "no frozen anchors and no claim to permanence", an
        argument about why 031 had to be promoted out of a plan. It is a
        live document and is cited elsewhere in the repo; nothing about it
        is lost by dropping the promotion note.
