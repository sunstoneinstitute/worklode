        client config the folded document does not carry forward. The web
        callback URIs in the same list stay.
      "http://localhost:18000": >-
        Same as http://localhost:8000: the second fixed CLI-callback port
        of the pre-031 flow, dead client config under the ephemeral-port
        loopback.
