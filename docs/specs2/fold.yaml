      - ref: "002-github-app-auth.md#sec-3.2"
        reason: >-
          superseded: GitHub web login replaced by
          023-keycloak-primary-auth.md#sec-3.1 (Keycloak is the only
          login). The confidential-client signed-state/no-PKCE rationale
          and the code-for-token exchange survive in 023 sec-3.3's link
          flow (folded sec-9.3); lost are the login-only mechanics -- the
          two-provider login page and GitHub session provisioning.
      - ref: "002-github-app-auth.md#sec-3.3"
        reason: >-
          superseded: replaced by 031-provider-neutral-cli-login.md and
          023-keycloak-primary-auth.md#sec-3.1 -- no device flow was ever
          built, and GitHub is no longer a CLI login provider at all. Lost:
          the unimplemented device-flow endpoint design
          (/auth/github/device/start, /poll), referenced nowhere else. Its
          keychain-storage decision (zalando/go-keyring) survives as
          031 sec-4 (folded sec-8.5), which also retires this section's
          0600 cleartext file fallback.
      - ref: "002-github-app-auth.md#sec-3.4"
        reason: >-
