    dropped:
      - ref: "001-keycloak-sso.md#sec-4"
        reason: >-
          superseded: the CLI's direct Keycloak OIDC+PKCE flow replaced by
          031-provider-neutral-cli-login.md (folded here as sec-8). Every
          surviving behaviour -- browser login ending in a stored `wl_`
