  # Part 4: 025 <- {025, 014, 027, 028, 034}. The document cluster, and the
  # largest fold in the corpus: 014 states what a design document is
  # (sections, anchors, versioning, coverage, frontmatter, the shorthand),
  # 025 moves the store under it and settles plans and task kinds, 028 adds
  # the post-acceptance half (escalation, in-place amendment, notes,
  # grooming), 027 supplies the event log the lifecycle rides on, and 034 the
  # git->backbone on-ramp that populates the store today. 025's sections are
  # very largely amendments to 014's -- sec-0/2/4/5/10 amended, sec-8
  # superseded -- so folding the two together is what lets the end state be
  # stated once; every one of those amendments dissolves uncited (ruling 1),
  # as do 027's and 034's amendments of 025 and 033's citations from within
  # 026 are the reciprocal case and stay.
  # Placement notes, in order of how much they cost a reader to reconstruct:
  #   * 014 sec-1 (the `ls:`->`wl:` rename) lands under `ns/` is the schema
  #     source. It is vocabulary identity, and the fold's other homes for it
  #     were worse: dropping it loses the rdf-registry source-path move, and
  #     006 cannot take it because 014 belongs to exactly one target.
  #   * 014 sec-2.1 (plans are demoted) merges with 025 sec-4 (plans are
  #     documents), which is the section that amends it. The argument 025
  #     preserves -- the section lock must never bind a plan -- survives as
  #     one statement rather than as a claim and its reversal.
  #   * 027 sec-0 opens the event-log group with sec-1, and 028 sec-0 opens
  #     the escalation group with sec-1: both are "why" sections for material
  #     that is a group here rather than a document.
  #   * 028 sec-9 (the ladder's events) sits under the event log with the
  #     other event material, not under escalation, because it is a table of
  #     event types and 027 owns that vocabulary.
  #   * The scaffolding trio is folded from five sources and consolidated by
  #     claim (rule 11); 014 sec-12, 025 sec-11 and 027 sec-11 are the
  #     "Amendments to existing specs" sections and are absorbed.
  # 034 sec-7 is *not* absorbed: only three of its four paragraphs are
  # amendment, and the fourth (why the on-ramp is not a second end state)
  # is design this document keeps.
