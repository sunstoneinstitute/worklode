        captures this fragment (one key covers both, and any other source
        contributing the same string). A property of docs/specs/004.
      ", binds ": >-
        Source-side span artifact, not an identifier. Second re-paired
        capture from 004 sec-2's wrapped Acquire-bullet span. A property of
        docs/specs/004.
      " + ": >-
        Source-side span artifact, not an identifier. Third re-paired
