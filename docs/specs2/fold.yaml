          survives in folded sec-9.5 without the package name) and of
          internal/githubauth.Roles.
    allow_dropped_ids:
      "http://localhost:8000": >-
        Deliberate drop, not a source-side artifact: 001 sec-2 registers
        this fixed CLI-callback redirect URI on the Keycloak client, but
        under 031 (folded sec-8) the server performs the final loopback
        redirect, the CLI binds an ephemeral port, and the loopback URI
