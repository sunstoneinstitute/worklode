        inline span "ON CONFLICT (source, external_id) DO NOTHING" across a
        line break; SPAN_RE's single-backtick branch forbids a newline, so
        the two nearest surviving backticks re-pair and capture the prose
        between them. A property of docs/specs/004, computable before any
        rewrite.
      ", ": >-
        Source-side span artifact, not an identifier. 004 sec-2's Acquire
