          023-keycloak-primary-auth.md#sec-3.1 -- roles come from Keycloak
          groups only. Lost: the org/team -> role mapping and its two
          GitHub membership endpoints (GET /user/memberships/orgs/{org},
          GET /orgs/{org}/teams/{team}/memberships/{username}); the removal
          itself, including `LODE_GITHUB_ORG` / `LODE_GITHUB_ADMIN_TEAM`
          and the Members: read permission, is stated in folded sec-3.
      - ref: "002-github-app-auth.md#sec-0"
        reason: >-
          spent: summary of the dual-provider delta that 023 reversed --
          "GitHub as an additional provider alongside Keycloak" is no
          section's rule anymore, but 023's replaces never reached this
          summary, so it stayed live. The durable half (capture a
          user-to-server token for "SunstoneWork on behalf of <user>"
          attribution) is restated by 023 sec-0 in folded sec-0; the
          hzdev-only scope by 023 sec-4's hzprod non-goal (folded sec-12).
