# Placement file for the docs/specs -> docs/specs2 fold
# (docs/plans/2026-08-11-spec-corpus-consolidation-1-fold-tooling.md).
#
# This is the only place a folding decision is recorded. scripts/fold.py
# derives the skeleton documents, mapping.yaml and every check from it --
# never from the written prose in docs/specs2/*.md -- so the consolidating
# rewrite can be as heavy as it needs to be without the mapping drifting.
#
# Every document keeps the number of its dominant source, so no WL-SPEC-<n>
# ever changes meaning. Every live anchor in currentspec.py's --with-drafts
# view appears exactly once across all `from:` and `dropped:` refs.
version: 1
corpus: {from: docs/specs, to: docs/specs2}
documents:
  # Part 3: the multi-source folds.
  #
  # 001 <- {001, 002, 023, 031}: the auth cluster. The same login design is
  # told three times at three stages -- 001 (Keycloak SSO), 002 (GitHub as a
  # second provider), 023 (Keycloak sole login again, GitHub demoted to
  # link-only) -- plus 031 (provider-neutral CLI login). The folded document
  # states the end state once: 023's login model and 031's CLI flow, on
  # 001's Keycloak plumbing, with 002's GitHub App surviving only as the
  # link-flow substrate. The four retired anchors (001 sec-4,
  # 002 sec-3.2/3.3/3.4) drop as superseded; the three current-state/summary
  # narratives of the reversed dual-provider era (002 sec-0, 002 sec-2,
  # 023 sec-2) drop as spent. 002 sec-3 and 023 sec-3 are empty "Design"
  # container headings and merge into the new sec-9 container instead of
  # dropping. 002's amendment notes on 001 (sec-0, sec-1, sec-3.2) were
  # never retracted when 023 reversed 002's login model; the part-3 plan's
  # task context rules each of them void rather than leaving the rewriter a
  # conflict.
  - to: 001-identity-and-authentication.md
    title: Identity & authentication
    sources: [001-keycloak-sso.md, 002-github-app-auth.md,
              023-keycloak-primary-auth.md, 031-provider-neutral-cli-login.md]
