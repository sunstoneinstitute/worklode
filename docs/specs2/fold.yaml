    allow_dropped_ids:
      "--under <epic>": >-
        Deliberate drop of a pre-029 spelling: 018 sec-6's CLI block reads
        `lode task parent <id> --under <epic>`, and 029 sec-2 retired the
        epic kind, so any ordinary task can be the parent. The folded flag
