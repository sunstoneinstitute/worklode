---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: worklode
resources:
  - namespace.yaml
  - postgres.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
configMapGenerator:
  - name: worklode-migrations
    files:
      - migrations/0001_baseline.up.sql
      - migrations/0001_baseline.down.sql
      - migrations/0002_prioritization.up.sql
      - migrations/0002_prioritization.down.sql
      - migrations/0003_project_keys.up.sql
      - migrations/0003_project_keys.down.sql
      - migrations/0004_agent_sessions.up.sql
      - migrations/0004_agent_sessions.down.sql
      - migrations/0005_delivery.up.sql
      - migrations/0005_delivery.down.sql
      - migrations/0006_task_hierarchy.up.sql
      - migrations/0006_task_hierarchy.down.sql
