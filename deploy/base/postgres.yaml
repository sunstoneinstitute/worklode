---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: worklode-postgres
  namespace: worklode
spec:
  instances: 1  # dev-scale; bump to 3 for prod HA
  # standard flavor bundles the pgvector .so; see
  # deploy/base/migrations/0007_skills.up.sql. vector is NOT a trusted
  # extension, so the app role (non-superuser) cannot CREATE EXTENSION it —
  # postInitApplicationSQL below runs as superuser at bootstrap, and
  # deploy/base/database.yaml (the Database CRD) covers already-bootstrapped
  # clusters, where postInitApplicationSQL does not apply.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-202607271318-standard-bookworm
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: worklode
      owner: worklode
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"
  affinity:
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
