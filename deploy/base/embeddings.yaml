---
# EmbeddingGemma-300M served on CPU by text-embeddings-inference, with the
# weights baked into the image (040 §2.3).
# It exposes the OpenAI-compatible /v1/embeddings that internal/embed.OpenAI
# already speaks, so the default deployment needs no new provider code: it is
# LODE_EMBEDDING_URL in configmap.yaml pointed at the Service below.
#
# In base rather than in the overlays: dev and prod embed the same corpus with
# the same model at the same width (§2.2), and nothing about this deployment is
# environment-specific. The overlays carry environment identity — hostnames,
# OIDC clients, the cluster env map — and this has none.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worklode-embeddings
  namespace: worklode
  labels:
    app: worklode-embeddings
spec:
  replicas: 1
  # Surge to two pods and take none away: on a node without the image cached,
  # a replacement pulls 1.5 GB before it is ready, so the old pod has to keep
  # serving until then. This is what the defaults already round to at one
  # replica; it is spelled out so a replica-count change cannot move it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: worklode-embeddings
  template:
    metadata:
      labels:
        app: worklode-embeddings
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: embeddings
          # Built by .github/workflows/build-embeddings-image.yml from
          # deploy/embeddings.Dockerfile, by hand, once per model version. The
          # tag names the model and the base it was built from.
          image: ghcr.io/sunstoneinstitute/worklode-embeddings:embeddinggemma-300m-tei1.9.3
          imagePullPolicy: IfNotPresent
          args:
            # A filesystem path, not a repo id: the weights are in the image,
            # so the server never contacts huggingface.co and needs no token.
            - --model-id=/model
            - --port=8080
            # The indexer embeds one subject per call and sends all of that
            # subject's chunks in one request (internal/indexer.vectors). A
            # long spec chunks on every section anchor (040 §4.2), so the
            # server's default client batch of 32 would 413 on the largest
            # documents in the corpus.
            - --max-client-batch-size=256
            # A chunk over the model's 2048-token window truncates instead of
            # failing the whole pass. §4.1's chunk budget is what keeps chunks
            # inside the window; this is the net under it, not a substitute.
            - --auto-truncate
            # The queue behind the backend is bounded by this, and the backend
            # caps itself at 4 requests per batch on CPU, so one 256-input
            # client request occupies 256 slots for a long time. Two
            # overlapping ones reach the default 512 exactly, and TEI's
            # try_send then panics ("No backend receiver. This is a bug.:
            # Full(..)") instead of returning 429 — after which /v1/embeddings
            # and /health hang while /info still answers. Headroom for four
            # full client batches.
            - --max-concurrent-requests=2048
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              # 040 §2.3's "~200 MB resident" is the model quantised; the
              # safetensors text-embeddings-inference actually loads are fp32,
              # 1.21 GB on disk and about that resident. Still one small pod,
              # not a node pool — but requesting 200 Mi would get it OOM-killed
              # on the first pass. Quantised serving (llama.cpp, the §2.3
              # alternative) is what would earn the smaller number.
              memory: "1536Mi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2"
          # Loading the baked weights off local disk takes tens of seconds. A
          # startup probe covers that without loosening liveness afterwards.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          # Both probes are sized against a busy server, not an idle one.
          # EmbeddingGemma on CPU saturates this pod's two cores for the length
          # of one indexer request, and /health answers on the same starved
          # runtime, so a 3s timeout reads "pinned" as "hung". The old settings
          # killed the pod every few minutes: SIGKILL, a ~60s model warm-up,
          # one more request, killed again, with the in-flight embed call lost
          # each time (which WL-714 turns into dropped chunk rows).
          #
          # Liveness is deliberately slacker than readiness, so readiness always
          # fires first and liveness only reaches a process that has been
          # unresponsive for five minutes — a hang, not a batch.
          # /info here too, for the same reason as readiness below: /health
          # blocks behind the inference queue and cannot tell "busy" from
          # "hung", so as a kill signal it only ever produces false
          # positives. It killed this pod 11 times in four hours (exit 137,
          # "Liveness probe failed: context deadline exceeded" x144) while
          # the server was answering embeds normally.
          #
          # ponytail: this now only catches a wedged HTTP listener, not a
          # wedged backend. The backend wedge we actually saw aborts the
          # process (exit 139), which the kubelet restarts anyway, so the
          # coverage lost is smaller than the outage this caused.
          livenessProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 5
          # /info, not /health: /health is erratic on this server even when it
          # is idle — measured at 40s+ (timed out), then 0.49s, then 4.3s in
          # three consecutive calls, while an actual embed round-trip took
          # 0.29s. There is one replica, so every /health lie empties the
          # Service and the indexer's next call gets "connection refused",
          # which WL-714 turns into dropped chunk rows. /info is a static
          # struct and answers immediately.
          #
          # ponytail: /info proves the process is serving HTTP, not that the
          # backend can embed. Nothing in the pod checks the backend now;
          # worklode_index_reembed_total is what reports it. Point both
          # probes back at a health endpoint if TEI ever gets one that
          # answers predictably.
          readinessProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: worklode-embeddings
  namespace: worklode
spec:
  selector:
    app: worklode-embeddings
  ports:
    - name: http
      port: 80
      targetPort: http
