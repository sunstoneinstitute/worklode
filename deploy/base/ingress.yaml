---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: work-tracker-ingress
  namespace: work-tracker
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - work-tracker.example.com
      secretName: work-tracker-tls
  rules:
    - host: work-tracker.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: work-tracker
                port:
                  number: 80
