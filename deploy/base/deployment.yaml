---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worklode
  namespace: worklode
  labels:
    app: worklode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worklode
  strategy:
    # SQLite on a ReadWriteOnce volume has one writer. Recreate avoids two
    # pods racing for the same volume/file lock during a rollout.
    type: Recreate
  template:
    metadata:
      labels:
        app: worklode
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: migrate
          image: ghcr.io/sunstoneinstitute/worklode:latest
          command: ["/lode", "migrate", "--db", "/data/wl.db", "--migrations-path", "/migrations"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: migrations
              mountPath: /migrations
              readOnly: true
      containers:
        - name: worklode
          image: ghcr.io/sunstoneinstitute/worklode:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            # Admin port: /healthz and /metrics only. Not exposed through the
            # ingress (which routes the Service http port); reachable in-cluster
            # for probes and Prometheus scraping.
            - name: admin
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: worklode-config
            - secretRef:
                name: worklode-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: worklode-data
        - name: migrations
          configMap:
            name: worklode-migrations
