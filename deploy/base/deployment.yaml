---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worklode
  namespace: worklode
  labels:
    app: worklode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worklode
  template:
    metadata:
      labels:
        app: worklode
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: migrate
          image: ghcr.io/sunstoneinstitute/worklode:latest
          command: ["/lode", "migrate", "--migrations-path", "/migrations"]
          env:
            - name: LODE_DSN
              valueFrom:
                secretKeyRef:
                  name: worklode-postgres-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      containers:
        - name: worklode
          image: ghcr.io/sunstoneinstitute/worklode:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            # Admin port: /healthz and /metrics only. Not exposed through the
            # ingress (which routes the Service http port); reachable in-cluster
            # for probes and Prometheus scraping.
            - name: admin
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: worklode-config
            - secretRef:
                name: worklode-secrets
          env:
            - name: LODE_DSN
              valueFrom:
                secretKeyRef:
                  name: worklode-postgres-app
                  key: uri
          volumeMounts:
            - name: secrets-catalog
              mountPath: /etc/worklode/secrets-catalog
              readOnly: true
            # The only writable path in the container. Must stay in sync with
            # LODE_BLOB_SPOOL_DIR in configmap.yaml.
            - name: blob-spool
              mountPath: /var/spool/worklode/blobs
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              # The blob-spool emptyDir counts as this container's ephemeral
              # storage. Requesting some makes the scheduler account for it and
              # keeps the pod off the front of the queue when a node hits disk
              # pressure, where a request of 0 puts it. The limit sits above
              # the volume's sizeLimit so that sizeLimit stays the binding
              # constraint — a lower limit here would evict first, for a
              # reason nothing points at.
              ephemeral-storage: "256Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: migrations
          configMap:
            name: worklode-migrations
        # Projected per environment by the overlay's ExternalSecret
        # (externalsecret-worklode-secrets-catalog.yaml); optional so base
        # alone, and any environment without the catalog item, still starts.
        - name: secrets-catalog
          secret:
            secretName: worklode-secrets-catalog
            optional: true
        # Scratch space for blob uploads. The root filesystem is read-only, so
        # without this every POST /api/v1/blobs fails EROFS in os.CreateTemp.
        #
        # Disk-backed on purpose: a `medium: Memory` emptyDir is charged to the
        # container's memory limit, and one upload can be maxBlobBytes
        # (internal/api/blobs.go), so a couple of concurrent uploads would
        # OOM-kill the pod instead of filling a directory.
        #
        # A spool file lives only for one request, so sizeLimit bounds
        # concurrent uploads, not stored blobs: 1Gi is ~10 max-size uploads at
        # once. Beyond it the kubelet evicts the pod, which is why the upload
        # path wants a concurrency cap (docs/follow-ups.md) — keep sizeLimit
        # and the ephemeral-storage limit above in step.
        - name: blob-spool
          emptyDir:
            sizeLimit: 1Gi
