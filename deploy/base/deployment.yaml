---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worklode
  namespace: worklode
  labels:
    app: worklode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worklode
  template:
    metadata:
      labels:
        app: worklode
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: migrate
          image: ghcr.io/sunstoneinstitute/worklode:latest
          command: ["/lode", "migrate", "--migrations-path", "/migrations"]
          env:
            - name: LODE_DSN
              valueFrom:
                secretKeyRef:
                  name: worklode-postgres-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      containers:
        - name: worklode
          image: ghcr.io/sunstoneinstitute/worklode:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            # Admin port: /healthz and /metrics only. Not exposed through the
            # ingress (which routes the Service http port); reachable in-cluster
            # for probes and Prometheus scraping.
            - name: admin
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: worklode-config
            - secretRef:
                name: worklode-secrets
          env:
            - name: LODE_DSN
              valueFrom:
                secretKeyRef:
                  name: worklode-postgres-app
                  key: uri
          volumeMounts:
            - name: secrets-catalog
              mountPath: /etc/worklode/secrets-catalog
              readOnly: true
            # The only writable path in the container. Must stay in sync with
            # LODE_BLOB_SPOOL_DIR in configmap.yaml.
            - name: blob-spool
              mountPath: /var/spool/worklode/blobs
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: migrations
          configMap:
            name: worklode-migrations
        # Projected per environment by the overlay's ExternalSecret
        # (externalsecret-worklode-secrets-catalog.yaml); optional so base
        # alone, and any environment without the catalog item, still starts.
        - name: secrets-catalog
          secret:
            secretName: worklode-secrets-catalog
            optional: true
        # Scratch space for blob uploads (spec 021 §5). readOnlyRootFilesystem
        # is true, so without this the upload handler's os.CreateTemp fails
        # EROFS and every POST /api/v1/blobs 500s.
        #
        # Disk-backed on purpose — no `medium: Memory`. A tmpfs emptyDir is
        # charged to the container's 512Mi memory limit, and one upload can be
        # maxBlobBytes = 100 MiB (internal/api/blobs.go), so two or three
        # concurrent uploads would OOM-kill the pod instead of merely filling
        # a directory.
        #
        # sizeLimit 1Gi: a spool file lives only for the duration of one
        # request (the handler unlinks it on return), so the limit has to
        # cover concurrent in-flight uploads, not accumulated blobs. 1Gi is
        # ten simultaneous max-size uploads, well past what a single replica
        # serving a handful of agents will ever see, and small enough to be
        # unremarkable against node ephemeral storage. Exceeding it evicts the
        # pod, so the headroom is deliberate; raise it in step with
        # maxBlobBytes or replica concurrency, never below 2x maxBlobBytes.
        - name: blob-spool
          emptyDir:
            sizeLimit: 1Gi
