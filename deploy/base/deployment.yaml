---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: work-tracker
  namespace: work-tracker
  labels:
    app: work-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: work-tracker
  strategy:
    # SQLite on a ReadWriteOnce volume has one writer. Recreate avoids two
    # pods racing for the same volume/file lock during a rollout.
    type: Recreate
  template:
    metadata:
      labels:
        app: work-tracker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: migrate
          image: ghcr.io/sunstoneinstitute/work-tracker:latest
          command: ["/wt", "migrate", "--db", "/data/wt.db", "--migrations-path", "/migrations"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: migrations
              mountPath: /migrations
              readOnly: true
      containers:
        - name: work-tracker
          image: ghcr.io/sunstoneinstitute/work-tracker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: work-tracker-config
            - secretRef:
                name: work-tracker-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: work-tracker-data
        - name: migrations
          configMap:
            name: work-tracker-migrations
