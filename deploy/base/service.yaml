---
apiVersion: v1
kind: Service
metadata:
  name: worklode
  namespace: worklode
spec:
  selector:
    app: worklode
  ports:
    - name: http
      port: 80
      targetPort: http
    # In-cluster scraping of /metrics (and /healthz). The ingress references the
    # http port only, so this admin port is never exposed publicly.
    - name: metrics
      port: 9090
      targetPort: admin
