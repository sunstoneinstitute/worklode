---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worklode-config
  namespace: worklode
data:
  LODE_CLUSTER_ENV_MAP: ""
  # Which kind of instance this is (039 §3) — not the environment of the
  # deployments it observes, which is LODE_CLUSTER_ENV_MAP above. prod is the
  # default and the safe answer: a prod instance that believes it is dev drops
  # decision records. Overlays for dev instances patch it to "dev".
  LODE_INSTANCE_ENV: "prod"
  LODE_BRANCH_TEMPLATE: ""
  LODE_SKILL_SOURCES: ""
  LODE_EMBEDDING_URL: ""
  LODE_EMBEDDING_MODEL: ""
  LODE_SECRETS_CATALOG_PATH: "/etc/worklode/secrets-catalog/catalog.toml"
  # Must match the blob-spool volumeMount in deployment.yaml; unset means
  # os.TempDir(), which is on the read-only root.
  LODE_BLOB_SPOOL_DIR: "/var/spool/worklode/blobs"
