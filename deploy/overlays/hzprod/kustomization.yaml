---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: worklode
resources:
  - ../../base
  - externalsecret-worklode-secrets.yaml
  - externalsecret-worklode-secrets-catalog.yaml
  - mcp-public-ingress.yaml
patches:
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: worklode
        labels:
          sunstone.institute/ghcr-pull: "true"
  - target:
      kind: ConfigMap
      name: worklode-config
    patch: |-
      - op: replace
        path: /data/LODE_CLUSTER_ENV_MAP
        value: "dev=dev,hzdev=dev,prod=prod,hzprod=prod,admin=prod"
      - op: replace
        path: /data/LODE_SKILL_SOURCES
        value: "sunstoneinstitute/claude-plugins@main:plugins/*/skills/*"
      - op: add
        path: /data/LODE_OIDC_ISSUER
        value: "https://auth.sunstoneinstitute.ai/realms/sunstone"
      - op: add
        path: /data/LODE_OIDC_CLIENT_ID
        value: "worklode-prod"
      # The mesh host stays the login host: the MCP authorization endpoint
      # and /auth/callback are served on it.
      - op: add
        path: /data/LODE_PUBLIC_URL
        value: "https://worklode.sunstone.internal"
      # Public host for claude.ai and Cowork (mcp-public-ingress.yaml). Both
      # this and LODE_PUBLIC_URL are accepted as an MCP token's resource.
      - op: add
        path: /data/LODE_MCP_PUBLIC_URL
        value: "https://worklode.prod.sunstoneinstitute.ai"
  - target:
      kind: Ingress
      name: worklode-ingress
    # Mesh-only: internal ingress and the internal CA.
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: nginx-internal
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: sunstone-internal-ca
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - worklode.sunstone.internal
      - op: replace
        path: /spec/rules/0/host
        value: worklode.sunstone.internal
images:
  - name: ghcr.io/sunstoneinstitute/worklode
    newTag: latest
