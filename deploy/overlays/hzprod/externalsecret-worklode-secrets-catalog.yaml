---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worklode-secrets-catalog
  namespace: worklode
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-hzprod-worklode
  target:
    name: worklode-secrets-catalog
    creationPolicy: Owner
  # The 1Password item `worklode-secrets-catalog` projects every field label as
  # a key of the Secret, so `catalog.toml` is a field label on that item.
  # `dataFrom.extract` rather than an explicit `data:` list keeps adding a
  # catalog entry a 1Password edit instead of a PR against this public repo
  # (spec 017 §1: vault and item names are mildly sensitive). Built-in item
  # fields become extra keys in the mount; the server ignores them.
  dataFrom:
    - extract:
        key: worklode-secrets-catalog
