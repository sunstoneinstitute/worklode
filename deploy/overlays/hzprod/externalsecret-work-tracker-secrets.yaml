---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: work-tracker-secrets
  namespace: work-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-hzprod-work-tracker
  target:
    name: work-tracker-secrets
    creationPolicy: Owner
  data:
    # WT_BOOTSTRAP_TOKEN must match ^wt_[0-9a-f]{40}$ — set the 1Password field
    # to `wt_$(openssl rand -hex 20)`. A bare hex string (no wt_ prefix) fails
    # validation and crash-loops the pod at startup.
    - secretKey: WT_BOOTSTRAP_TOKEN
      remoteRef:
        key: work-tracker-secrets
        property: WT_BOOTSTRAP_TOKEN
    - secretKey: WT_GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: work-tracker-secrets
        property: WT_GITHUB_WEBHOOK_SECRET
    - secretKey: WT_FLUX_WEBHOOK_SECRET
      remoteRef:
        key: work-tracker-secrets
        property: WT_FLUX_WEBHOOK_SECRET
