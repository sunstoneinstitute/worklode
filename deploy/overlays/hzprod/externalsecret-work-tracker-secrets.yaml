---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worklode-secrets
  namespace: worklode
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-hzprod-worklode
  target:
    name: worklode-secrets
    creationPolicy: Owner
  data:
    # WL_BOOTSTRAP_TOKEN must match ^wl_[0-9a-f]{40}$ — set the 1Password field
    # to `wl_$(openssl rand -hex 20)`. A bare hex string (no wl_ prefix) fails
    # validation and crash-loops the pod at startup.
    - secretKey: WL_BOOTSTRAP_TOKEN
      remoteRef:
        key: worklode-secrets
        property: WT_BOOTSTRAP_TOKEN
    - secretKey: WT_GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: worklode-secrets
        property: WT_GITHUB_WEBHOOK_SECRET
    - secretKey: WT_FLUX_WEBHOOK_SECRET
      remoteRef:
        key: worklode-secrets
        property: WT_FLUX_WEBHOOK_SECRET
