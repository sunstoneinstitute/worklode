---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worklode-secrets
  namespace: worklode
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-hzprod-worklode
  target:
    name: worklode-secrets
    creationPolicy: Owner
  data:
    # LODE_BOOTSTRAP_TOKEN must match ^wl_[0-9a-f]{40}$ — set the 1Password field
    # to `wl_$(openssl rand -hex 20)`. A bare hex string (no wl_ prefix) fails
    # validation and crash-loops the pod at startup.
    - secretKey: LODE_BOOTSTRAP_TOKEN
      remoteRef:
        key: worklode-secrets
        property: LODE_BOOTSTRAP_TOKEN
    - secretKey: LODE_GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: worklode-secrets
        property: LODE_GITHUB_WEBHOOK_SECRET
    - secretKey: LODE_FLUX_WEBHOOK_SECRET
      remoteRef:
        key: worklode-secrets
        property: LODE_FLUX_WEBHOOK_SECRET
    # GitHub App installation auth (repo delivery-profile discovery).
    # LODE_GITHUB_APP_PRIVATE_KEY is the App's PEM, newlines and all.
    - secretKey: LODE_GITHUB_APP_ID
      remoteRef:
        key: worklode-secrets
        property: LODE_GITHUB_APP_ID
    - secretKey: LODE_GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: worklode-secrets
        property: LODE_GITHUB_APP_PRIVATE_KEY
    - secretKey: LODE_EMBEDDING_API_KEY
      remoteRef:
        key: worklode-secrets
        property: LODE_EMBEDDING_API_KEY
