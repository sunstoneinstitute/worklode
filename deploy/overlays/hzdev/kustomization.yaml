---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: worklode
resources:
  - ../../base
  - externalsecret-worklode-secrets.yaml
  - externalsecret-worklode-secrets-catalog.yaml
patches:
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: worklode
        labels:
          sunstone.institute/ghcr-pull: "true"
  - target:
      kind: ConfigMap
      name: worklode-config
    patch: |-
      - op: replace
        path: /data/LODE_CLUSTER_ENV_MAP
        value: "dev=dev,hzdev=dev,prod=prod,hzprod=prod,admin=prod"
      # hzdev holds the dev instance (039 §2), so it is the one that does not
      # demand a justification for a delete (044 §3).
      - op: replace
        path: /data/LODE_INSTANCE_ENV
        value: "dev"
      - op: add
        path: /data/LODE_PUBLIC_URL
        value: "https://worklode.dev.sunstoneinstitute.ai"
      - op: replace
        path: /data/LODE_SKILL_SOURCES
        value: "sunstoneinstitute/claude-plugins@main:plugins/*/skills/*"
      # The embedding provider here runs near the 2s recommendTimeout,
      # making every task-brief request slow. Off until that provider is
      # fixed or swapped.
      - op: replace
        path: /data/LODE_DISABLE_SKILL_MATCHING
        value: "true"
      - op: add
        path: /data/LODE_OIDC_ISSUER
        value: "https://auth.sunstoneinstitute.ai/realms/sunstone"
      - op: add
        path: /data/LODE_OIDC_CLIENT_ID
        value: "worklode-dev"
      # WL-240/WL-241: the hzdev Hetzner Object Storage bucket. Prod is
      # deliberately unset in base until WL-231 settles dev/prod separation.
      - op: replace
        path: /data/LODE_BLOB_ENDPOINT
        value: "https://hel1.your-objectstorage.com"
      - op: replace
        path: /data/LODE_BLOB_BUCKET
        value: "worklode-dev"
      - op: replace
        path: /data/LODE_BLOB_REGION
        value: "hel1"
  - target:
      kind: Ingress
      name: worklode-ingress
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - worklode.dev.sunstoneinstitute.ai
      - op: replace
        path: /spec/rules/0/host
        value: worklode.dev.sunstoneinstitute.ai
images:
  - name: ghcr.io/sunstoneinstitute/worklode
    newTag: "b0edbc6"
    newName: ghcr.io/sunstoneinstitute/worklode
