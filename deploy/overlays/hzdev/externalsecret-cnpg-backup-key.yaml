---
# Static key for the cnpg-backups GSA, same item as the other hzdev apps
# (copied into this app's vault).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-gcs-key
  namespace: worklode
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-hzdev-worklode
  target:
    name: cnpg-backup-gcs-key
    creationPolicy: Owner
  data:
    - secretKey: gcs-key.json
      remoteRef:
        key: cnpg-backup-gcs-key
        property: credential
