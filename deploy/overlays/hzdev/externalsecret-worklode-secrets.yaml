---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worklode-secrets
  namespace: worklode
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-hzdev-worklode
  target:
    name: worklode-secrets
    creationPolicy: Owner
  data:
    # LODE_BOOTSTRAP_TOKEN must match ^wl_[0-9a-f]{40}$ — set the 1Password field
    # to `wl_$(openssl rand -hex 20)`. A bare hex string (no wl_ prefix) fails
    # validation and crash-loops the pod at startup.
    - secretKey: LODE_BOOTSTRAP_TOKEN
      remoteRef:
        key: worklode-secrets
        property: LODE_BOOTSTRAP_TOKEN
    - secretKey: LODE_GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: worklode-secrets
        property: LODE_GITHUB_WEBHOOK_SECRET
    - secretKey: LODE_FLUX_WEBHOOK_SECRET
      remoteRef:
        key: worklode-secrets
        property: LODE_FLUX_WEBHOOK_SECRET
    # GitHub App web login. LODE_TOKEN_ENC_KEY must be exactly 64 hex chars
    # (32 bytes) or the pod crash-loops; the App client id/secret are copied
    # from op://Admin/sunstonework-github-app (ESO cannot read the Admin vault).
    - secretKey: LODE_GITHUB_APP_CLIENT_ID
      remoteRef:
        key: worklode-secrets
        property: LODE_GITHUB_APP_CLIENT_ID
    - secretKey: LODE_GITHUB_APP_CLIENT_SECRET
      remoteRef:
        key: worklode-secrets
        property: LODE_GITHUB_APP_CLIENT_SECRET
    - secretKey: LODE_SESSION_SECRET
      remoteRef:
        key: worklode-secrets
        property: LODE_SESSION_SECRET
    - secretKey: LODE_TOKEN_ENC_KEY
      remoteRef:
        key: worklode-secrets
        property: LODE_TOKEN_ENC_KEY
