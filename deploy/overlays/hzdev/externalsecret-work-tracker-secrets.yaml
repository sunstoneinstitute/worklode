---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: work-tracker-secrets
  namespace: work-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-hzdev-work-tracker
  target:
    name: work-tracker-secrets
    creationPolicy: Owner
  data:
    # WT_BOOTSTRAP_TOKEN must match ^wt_[0-9a-f]{40}$ — set the 1Password field
    # to `wt_$(openssl rand -hex 20)`. A bare hex string (no wt_ prefix) fails
    # validation and crash-loops the pod at startup.
    - secretKey: WT_BOOTSTRAP_TOKEN
      remoteRef:
        key: work-tracker-secrets
        property: WT_BOOTSTRAP_TOKEN
    - secretKey: WT_GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: work-tracker-secrets
        property: WT_GITHUB_WEBHOOK_SECRET
    - secretKey: WT_FLUX_WEBHOOK_SECRET
      remoteRef:
        key: work-tracker-secrets
        property: WT_FLUX_WEBHOOK_SECRET
    # GitHub App web login. WT_TOKEN_ENC_KEY must be exactly 64 hex chars
    # (32 bytes) or the pod crash-loops; the App client id/secret are copied
    # from op://Admin/sunstonework-github-app (ESO cannot read the Admin vault).
    - secretKey: WT_GITHUB_APP_CLIENT_ID
      remoteRef:
        key: work-tracker-secrets
        property: WT_GITHUB_APP_CLIENT_ID
    - secretKey: WT_GITHUB_APP_CLIENT_SECRET
      remoteRef:
        key: work-tracker-secrets
        property: WT_GITHUB_APP_CLIENT_SECRET
    - secretKey: WT_SESSION_SECRET
      remoteRef:
        key: work-tracker-secrets
        property: WT_SESSION_SECRET
    - secretKey: WT_TOKEN_ENC_KEY
      remoteRef:
        key: work-tracker-secrets
        property: WT_TOKEN_ENC_KEY
