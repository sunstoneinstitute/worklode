---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: work-tracker-secrets
  namespace: work-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-hzdev-work-tracker
  target:
    name: work-tracker-secrets
    creationPolicy: Owner
  data:
    - secretKey: WT_BOOTSTRAP_TOKEN
      remoteRef:
        key: work-tracker-secrets
        property: WT_BOOTSTRAP_TOKEN
    - secretKey: WT_GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: work-tracker-secrets
        property: WT_GITHUB_WEBHOOK_SECRET
    - secretKey: WT_FLUX_WEBHOOK_SECRET
      remoteRef:
        key: work-tracker-secrets
        property: WT_FLUX_WEBHOOK_SECRET
