# Shape of the `catalog.toml` field on the 1Password item
# `worklode-secrets-catalog` (spec 017 §1). Documentation only — no
# kustomization references this file.
#
# Real entries are edited in 1Password and never committed here: the catalog
# maps a symbolic name to an op:// reference plus policy, and vault/item names
# are themselves mildly sensitive. Each environment's ExternalSecret
# (deploy/overlays/<env>/externalsecret-worklode-secrets-catalog.yaml)
# projects the item into the `worklode-secrets-catalog` Secret, which the
# server mounts at LODE_SECRETS_CATALOG_PATH.

# [GITHUB_TOKEN]
# ref = "op://Employee/GitHub agent token/credential"
# description = "GitHub credential the agent operates as (operator's own identity)"
# baseline = true            # packed for every task; no consent prompt

# [KUBECONFIG_HZDEV]
# ref = "op://Infrastructure/hzdev kubeconfig/kubeconfig"
# description = "Kubernetes access to the hzdev cluster, for troubleshooting tasks"
# # baseline defaults to false: must be declared per task, listed at the consent prompt
