# Shape of the `catalog.toml` field on the 1Password item
# `worklode-secrets-catalog` (spec 017 §1). Documentation only — no
# kustomization references this file.
#
# Real entries are edited in 1Password and never committed here: the catalog
# maps a symbolic name to an op:// reference plus policy, and vault/item names
# are themselves mildly sensitive. Each environment's ExternalSecret
# (deploy/overlays/<env>/externalsecret-worklode-secrets-catalog.yaml)
# projects the item into the `worklode-secrets-catalog` Secret, which the
# server mounts at LODE_SECRETS_CATALOG_PATH.

# [GITHUB_TOKEN]
# ref = "op://Employee/GitHub agent token/credential"
# description = "GitHub credential the agent operates as (operator's own identity)"
# baseline = true            # packed for every task; no consent prompt

# [OPENALEX_API_KEY]
# ref = "op://Infrastructure/openalex/key"
# description = "OpenAlex API key"
# # baseline defaults to false: must be declared per task, listed at the consent prompt

# A templated entry (spec 042), for an asset too large for a keystore item:
# `template` names a SIBLING FIELD of this same 1Password item holding the
# template text, each `cred.<PLACEHOLDER>` is one small secret, and `env` is
# the name `lode secrets exec` exports (defaulting to the entry name). The
# keystore holds only the credentials; exec renders the template into a 0600
# file and points `env` at it.
#
# [KUBECONFIG_HZDEV]
# description = "Kubernetes access to the hzdev cluster, for troubleshooting tasks"
# template = "kubeconfig-hzdev.yaml"
# env = "KUBECONFIG"
# cred.CLIENT_CERT = "op://Infrastructure/hzdev kubeconfig/client-cert"
# cred.CLIENT_KEY = "op://Infrastructure/hzdev kubeconfig/client-key"
#
# The sibling `kubeconfig-hzdev.yaml` field on the same item then holds:
#
# apiVersion: v1
# clusters:
# - cluster:
#     certificate-authority-data: <the cluster CA, not a secret>
#     server: https://hzdev.example
#   name: hzdev
# users:
# - name: hzdev
#   user:
#     client-certificate-data: {{ CLIENT_CERT }}
#     client-key-data: {{ CLIENT_KEY }}
#
# Every placeholder needs a cred key and every cred key needs a placeholder;
# the server rejects the catalog otherwise.
