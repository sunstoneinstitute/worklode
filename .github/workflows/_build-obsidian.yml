name: build-obsidian

# Reusable workflow: builds the Obsidian plugin and attaches main.js and
# manifest.json to the tag's GitHub Release. Called by release.yml (hand-pushed
# v* tag) and promote-prod.yml (after promotion pushes its own v* tag).
#
# Loose files, not a zip: that is what Obsidian's own release convention and
# BRAT expect, and it is what the manual install in plugins/obsidian/README.md
# copies into a vault.
#
# The Release object is created by the bottle pipeline; this workflow is a
# needs-dependent of build-bottles in both callers, so it only ever attaches an
# asset to a Release that already exists (no concurrent-create race).

on:
  workflow_call:
    inputs:
      tag:
        description: v* tag to build the Obsidian plugin for (must already exist on the remote)
        required: true
        type: string

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout worklode at the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Build plugin
        working-directory: plugins/obsidian
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # promote-prod.yml bumps manifest.json *after* pushing the tag, so the
          # committed version at this ref is the previous release's. Stamp the
          # tag's version so the shipped manifest matches the Release it is
          # attached to, on both callers.
          jq --arg v "${TAG#v}" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          pnpm install --frozen-lockfile
          pnpm build

      - name: Attach plugin to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            plugins/obsidian/main.js
            plugins/obsidian/manifest.json
          fail_on_unmatched_files: true
