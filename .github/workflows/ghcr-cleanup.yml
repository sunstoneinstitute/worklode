# Prunes old per-commit image tags from ghcr.io. Keeps every v* (prod) tag,
# latest, and the 30 newest SHA tags for dev rollback. The action deletes an
# untagged child manifest (image, attestation) only with its parent index.
name: GHCR cleanup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Log what would be deleted without deleting
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: sunstoneinstitute
          packages: worklode,worklode-watch
          exclude-tags: 'v*,latest'
          keep-n-tagged: 30
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
