name: number-migrations

# PRs add migrations as deploy/base/migrations/NEW-<slug>.{up,down}.sql. This
# gives them real numbers on the PR branch on every push, above main and any
# queued or auto-merge-armed PR (WL-931). A queued branch cannot be pushed to,
# so numbering waits for nothing. Two PRs numbered before either was armed can
# still collide: the merge queue's --no-new lint dequeues the loser, and on
# `dequeued` this renumbers its migrations above main and re-arms auto-merge
# (WL-932). A PR dequeued for any other reason is left out of the queue.
# Numbering logic lives in scripts/check-migrations.sh --number-new.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, dequeued]

permissions:
  contents: read

concurrency:
  group: number-migrations
  cancel-in-progress: false

jobs:
  number:
    # Forks cannot receive the bot's push.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: find NEW migrations
        id: new
        env:
          ACTION: ${{ github.event.action }}
        run: |
          if [ "$ACTION" = dequeued ] || compgen -G 'deploy/base/migrations/NEW*' >/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No NEW migrations; nothing to number."
          fi
      # Bot steps run only when there may be something to number, so a
      # missing App secret cannot fail unrelated pushes.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        if: steps.new.outputs.found == 'true'
        with:
          client-id: ${{ vars.MIGRATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MIGRATION_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: number and push
        if: steps.new.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 "$url" +refs/heads/main:refs/remotes/origin/main

          # shellcheck disable=SC2016 # $owner/$name are GraphQL variables
          # Migration numbers every other queued or auto-merge-armed PR adds.
          # Those are already numbered, since this workflow ran on their last
          # push.
          queue_nums=$(gh api graphql -F owner="$OWNER" -F name="$NAME" -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                mergeQueue(branch: "main") {
                  entries(first: 100) {
                    nodes { pullRequest { number files(first: 100) { nodes { path } } } }
                  }
                }
                pullRequests(states: OPEN, baseRefName: "main", first: 100) {
                  nodes { number autoMergeRequest { enabledAt } files(first: 100) { nodes { path } } }
                }
              }
            }' --jq "[(.data.repository.mergeQueue.entries.nodes // [])[].pullRequest,
                (.data.repository.pullRequests.nodes[] | select(.autoMergeRequest))][]
              | select(.number != $PR) | .files.nodes[].path" |
            sed -nE 's|^deploy/base/migrations/0*([0-9]+)_.*|\1|p' | sort -nu)
          queue_max=$(tail -1 <<<"$queue_nums")

          args=(--number-new --min $(( ${queue_max:-0} + 1 )))
          # Dequeued: also move this PR's numbered migrations that main has
          # overtaken or that another queued PR already uses.
          [ "$ACTION" != dequeued ] || args+=(--renumber-old --taken "$(paste -sd, - <<<"$queue_nums")")
          ./scripts/check-migrations.sh "${args[@]}"

          if git diff --cached --quiet; then
            echo "Nothing to renumber."
            exit 0
          fi
          git config user.name "$BOT"
          git config user.email "$BOT@users.noreply.github.com"
          git commit -m "Number migrations"
          git push "$url" HEAD:"refs/heads/$HEAD_REF"

          # The dequeue cleared auto-merge. Re-arm it only because this run
          # fixed the numbering, so the PR goes back into the queue.
          if [ "$ACTION" = dequeued ]; then
            gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY"
          fi
