name: number-migrations

# PRs add migrations as deploy/base/migrations/NEW-<slug>.{up,down}.sql. This
# gives them real numbers on the PR branch just before the merge queue, so
# parallel PRs never pick the same number (WL-931). Numbering logic lives in
# scripts/check-migrations.sh --number-new.

on:
  pull_request:
    branches: [main]
    types: [auto_merge_enabled, enqueued, dequeued, synchronize]

permissions:
  contents: read

concurrency:
  group: number-migrations
  cancel-in-progress: false

jobs:
  number:
    # Forks cannot receive the bot's push. A plain push only numbers once
    # auto-merge is armed, so a PR is numbered as late as possible.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'synchronize' || github.event.pull_request.auto_merge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: find NEW migrations
        id: new
        run: |
          if compgen -G 'deploy/base/migrations/NEW*' >/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No NEW migrations; nothing to number."
          fi
      # Bot steps run only when there is something to number, so a missing
      # App secret cannot fail unrelated PRs.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        if: steps.new.outputs.found == 'true'
        with:
          app-id: ${{ secrets.MIGRATION_BOT_APP_ID }}
          private-key: ${{ secrets.MIGRATION_BOT_PRIVATE_KEY }}
      - name: number and push
        if: steps.new.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 "$url" +refs/heads/main:refs/remotes/origin/main

          # shellcheck disable=SC2016 # $owner/$name are GraphQL variables
          # Highest migration number any other queued or auto-merge-armed PR
          # adds. Those are already numbered, since this workflow ran when
          # they were armed.
          queue_max=$(gh api graphql -F owner="$OWNER" -F name="$NAME" -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                mergeQueue(branch: "main") {
                  entries(first: 100) {
                    nodes { pullRequest { number files(first: 100) { nodes { path } } } }
                  }
                }
                pullRequests(states: OPEN, baseRefName: "main", first: 100) {
                  nodes { number autoMergeRequest { enabledAt } files(first: 100) { nodes { path } } }
                }
              }
            }' --jq "[(.data.repository.mergeQueue.entries.nodes // [])[].pullRequest,
                (.data.repository.pullRequests.nodes[] | select(.autoMergeRequest))][]
              | select(.number != $PR) | .files.nodes[].path" |
            sed -nE 's|^deploy/base/migrations/0*([0-9]+)_.*|\1|p' | sort -n | tail -1)

          ./scripts/check-migrations.sh --number-new --min $(( ${queue_max:-0} + 1 ))

          git config user.name "$BOT"
          git config user.email "$BOT@users.noreply.github.com"
          git commit -m "Number migrations"
          git push "$url" HEAD:"refs/heads/$HEAD_REF"
