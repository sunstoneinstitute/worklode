name: build-image

on:
  workflow_call:
    inputs:
      push:
        description: Push the built image to ghcr.io
        type: boolean
        default: true
      runs-on:
        description: >-
          Runner label(s) as a JSON array — '["ubuntu-latest"]' for a hosted
          PR, '["docker","gha-buildcache"]' for a trusted one and for
          deploy-dev. This job needs both the Docker socket and a runner whose
          build-cache state survives between runs, two independent environment
          facts a future runner could have one of without the other — see
          docs/self-hosted-runner.md.
        type: string
        default: '["ubuntu-latest"]'
    outputs:
      image-tag:
        description: Git short SHA used as the image tag
        value: ${{ jobs.build.outputs.image-tag }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/sunstoneinstitute
  APP: worklode

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Set image path and tag
        id: image
        run: |
          echo "path=${{ env.REGISTRY }}/${{ env.APP }}" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            {
              echo "list<<EOF"
              echo "${{ steps.image.outputs.path }}:${{ steps.image.outputs.tag }}"
              echo "${{ steps.image.outputs.path }}:latest"
              echo "EOF"
              echo "watcher-list<<EOF"
              echo "${{ steps.image.outputs.path }}-watch:${{ steps.image.outputs.tag }}"
              echo "${{ steps.image.outputs.path }}-watch:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "list<<EOF"
              echo "worklode:ci"
              echo "EOF"
              echo "watcher-list<<EOF"
              echo "worklode-watch:ci"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A `gha-buildcache` runner keeps one named builder across runs:
      # `keep-state` makes the teardown `buildx rm --keep-state`, so the state
      # volume survives and the next run re-attaches it with its layer cache
      # and the Dockerfile's `RUN --mount=type=cache` contents already warm.
      # Nothing then has to be exported anywhere, which is why the two cache
      # steps and `type=gha` below are hosted-only. A hosted runner is a fresh
      # VM, so it gets an anonymous throwaway builder and pays for both.
      # Both hel01 runners share this one builder — they share the daemon
      # anyway, and BuildKit handles concurrent builds itself.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        id: buildx
        with:
          name: ${{ contains(inputs.runs-on, 'gha-buildcache') && 'worklode-ci' || '' }}
          keep-state: ${{ contains(inputs.runs-on, 'gha-buildcache') }}

      # Hosted only. `go-cache-mount` is workspace-relative, which is safe here
      # and only here: actions/checkout's clean step would erase it on a runner
      # that persists (see docs/self-hosted-runner.md).
      # Only push runs write (skip-extraction otherwise); non-push runs read
      # the shared cache without poisoning it.
      - name: Restore Go cache mounts
        if: "!contains(inputs.runs-on, 'gha-buildcache')"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: go-cache-mount
          key: ${{ runner.os }}-docker-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-docker-go-

      - name: Inject Go cache into buildx
        if: "!contains(inputs.runs-on, 'gha-buildcache')"
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "go-cache-mount/mod": "/go/pkg/mod",
              "go-cache-mount/build": "/root/.cache/go-build"
            }
          skip-extraction: ${{ !inputs.push }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: server
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: ${{ !contains(inputs.runs-on, 'gha-buildcache') && 'type=gha,scope=docker-server' || '' }}
          cache-to: ${{ (inputs.push && !contains(inputs.runs-on, 'gha-buildcache')) && 'type=gha,mode=max,scope=docker-server' || '' }}

      - name: Build and push watcher Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: watcher
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.watcher-list }}
          cache-from: ${{ !contains(inputs.runs-on, 'gha-buildcache') && 'type=gha,scope=docker-watcher' || '' }}
          cache-to: ${{ (inputs.push && !contains(inputs.runs-on, 'gha-buildcache')) && 'type=gha,mode=max,scope=docker-watcher' || '' }}

