name: build-image

on:
  workflow_call:
    inputs:
      push:
        description: Push the built image to ghcr.io
        type: boolean
        default: true
      runs-on:
        description: >-
          Runner label(s) as a JSON array — '["ubuntu-latest"]' for a hosted
          PR, '["docker","gha-buildcache"]' for a trusted one. This job needs
          both the Docker socket and a runner-provided build-cache directory,
          two independent environment facts a future runner could have one
          of without the other — see docs/self-hosted-runner.md.
        type: string
        default: '["ubuntu-latest"]'
    outputs:
      image-tag:
        description: Git short SHA used as the image tag
        value: ${{ jobs.build.outputs.image-tag }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/sunstoneinstitute
  APP: worklode

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Set image path and tag
        id: image
        run: |
          echo "path=${{ env.REGISTRY }}/${{ env.APP }}" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            {
              echo "list<<EOF"
              echo "${{ steps.image.outputs.path }}:${{ steps.image.outputs.tag }}"
              echo "${{ steps.image.outputs.path }}:latest"
              echo "EOF"
              echo "watcher-list<<EOF"
              echo "${{ steps.image.outputs.path }}-watch:${{ steps.image.outputs.tag }}"
              echo "${{ steps.image.outputs.path }}-watch:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "list<<EOF"
              echo "worklode:ci"
              echo "EOF"
              echo "watcher-list<<EOF"
              echo "worklode-watch:ci"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        id: buildx

      # Where buildkit-cache-dance extracts the Dockerfile's Go cache mounts
      # to persist them across runs. `gha-buildcache` marks a runner with its
      # own prepared, persistent directory outside the checkout (so
      # actions/checkout's clean step never wipes it) — self-hosted reads and
      # writes it directly with no network round trip. ubuntu-latest has no
      # such directory (a fresh VM every run), so it stays relative to the
      # workspace and goes through actions/cache instead.
      - name: Cache-mount directory
        id: cache-dir
        run: |
          if [ "${{ contains(inputs.runs-on, 'gha-buildcache') }}" = "true" ]; then
            echo "path=$HOME/.cache/gha-buildcache" >> "$GITHUB_OUTPUT"
          else
            echo "path=go-cache-mount" >> "$GITHUB_OUTPUT"
          fi

      # Only push runs write (skip-extraction otherwise); non-push runs read
      # the shared cache without poisoning it.
      - name: Restore Go cache mounts
        if: "!contains(inputs.runs-on, 'gha-buildcache')"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-dir.outputs.path }}
          key: ${{ runner.os }}-docker-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-docker-go-

      - name: Inject Go cache into buildx
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "${{ steps.cache-dir.outputs.path }}/mod": "/go/pkg/mod",
              "${{ steps.cache-dir.outputs.path }}/build": "/root/.cache/go-build"
            }
          skip-extraction: ${{ !inputs.push }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: server
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=docker-server
          cache-to: ${{ inputs.push && 'type=gha,mode=max,scope=docker-server' || '' }}

      - name: Build and push watcher Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: watcher
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.watcher-list }}
          cache-from: type=gha,scope=docker-watcher
          cache-to: ${{ inputs.push && 'type=gha,mode=max,scope=docker-watcher' || '' }}

