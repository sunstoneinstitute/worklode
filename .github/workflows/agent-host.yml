name: Agent host

# Keeps the long-lived Claude Code worker sessions on hel01 alive.
#
# An Actions job is ephemeral, so the agent sessions cannot BE the job. They
# live in a detached tmux server on the host; this workflow is the babysitter
# that reconciles them — create what is missing, respawn what died, otherwise
# do nothing. See docs/self-hosted-runner.md.
#
# Never triggered by pull_request. A self-hosted runner executing fork code is
# exactly what pr-checks.yml's `trusted` gate exists to prevent, and this
# workflow holds credentials that outlive the job.

on:
  schedule:
    # Every 15 minutes. This is also the recovery mechanism: the runner
    # service's systemd unit kills its whole cgroup on restart, tmux included,
    # so the tick is what brings the fleet back.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      window:
        description: "Reconcile only this window (default: every worker in workers.json)"
        type: string
        required: false
      dump_scrollback:
        description: >-
          Print each pane's recent scrollback into the job log. This repository
          is public and Actions logs are world-readable, so leave this off
          unless you are debugging and know what is on screen.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-host
  cancel-in-progress: false

jobs:
  reconcile:
    # gha-agent-host asserts tmux, claude, and the persistent
    # /home/ghrunner/gha-agent tree; gha-buildcache asserts the warm Go cache
    # this job's build relies on instead of an actions/cache round trip. Two
    # independent facts, so both are required rather than one implying the
    # other — see docs/self-hosted-runner.md.
    runs-on: ["gha-agent-host", "gha-buildcache"]
    timeout-minutes: 20
    env:
      AGENT_ROOT: /home/ghrunner/gha-agent
      LODE_SERVER_URL: https://worklode.dev.sunstoneinstitute.ai
      TMUX_SOCKET: gha-agent
      TMUX_SESSION: agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Everything durable lives outside the checkout. actions/checkout runs
      # `git clean -ffdx` here every run, and both runners share the one
      # checkout, so a binary left in it would not survive the next job.
      - name: Install binaries and scripts
        run: |
          set -euo pipefail
          make build-user
          install -d -m 0755 "$AGENT_ROOT/bin" "$AGENT_ROOT/logs"
          install -m 0755 bin/lode bin/lode-hook bin/lode-statusline "$AGENT_ROOT/bin/"
          install -m 0755 \
            .github/agent-host/supervisor.sh \
            .github/agent-host/poke.sh \
            .github/agent-host/rules-session.sh \
            "$AGENT_ROOT/bin/"
          "$AGENT_ROOT/bin/lode" --version || true

      # $HOME is not stable here: hel01-2's unit sets HOME to its own cache
      # directory, so either runner picking up this job would resolve a
      # different ~/.config/worklode. The agent's HOME is therefore an
      # explicit absolute path, never inherited.
      - name: Write config, token, and env
        env:
          LODE_TOKEN: ${{ secrets.LODE_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          for name in LODE_TOKEN CLAUDE_CODE_OAUTH_TOKEN WORKER_GITHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret $name is not set; the agent host cannot run without it"
              exit 1
            fi
          done

          agent_home="$AGENT_ROOT/home"
          install -d -m 0700 "$agent_home" "$agent_home/.config/worklode" "$agent_home/.claude"

          # printf, not a heredoc: a heredoc terminator has to sit at column
          # zero, and column zero inside a YAML block scalar ends the block.
          #
          # A hand-rolled `key = "value"` format, not real TOML — see the
          # parser in internal/cli/client.go. current_project is deliberately
          # absent: the clone's own .worklode/config.toml supplies it, which
          # keeps one worker able to work several projects later.
          printf 'server = "%s"\n' "$LODE_SERVER_URL" \
            > "$agent_home/.config/worklode/config.toml"
          chmod 0600 "$agent_home/.config/worklode/config.toml"

          # One `<server> <token>` line per server — see
          # internal/cli/tokenfile.go. A bare token here parses as nothing and
          # fails silently at the next request, so the format matters.
          printf '%s %s\n' "$LODE_SERVER_URL" "$LODE_TOKEN" \
            > "$agent_home/.config/worklode/token"
          chmod 0600 "$agent_home/.config/worklode/token"

          # Sourced by the window's own shell rather than passed via `tmux -e`:
          # a secret on a tmux command line is readable in `ps` by every user
          # on the box. Values are single-quoted so `set -a; . env` cannot
          # word-split or expand one.
          {
            printf "HOME='%s'\n" "$agent_home"
            printf "PATH='%s'\n" "$AGENT_ROOT/bin:/usr/local/bin:/usr/bin:/bin"
            printf "CLAUDE_CODE_OAUTH_TOKEN='%s'\n" "$CLAUDE_CODE_OAUTH_TOKEN"
            printf "GH_TOKEN='%s'\n" "$WORKER_GITHUB_TOKEN"
            printf "GITHUB_TOKEN='%s'\n" "$WORKER_GITHUB_TOKEN"
          } > "$AGENT_ROOT/env"
          chmod 0600 "$AGENT_ROOT/env"

      # The auto-mode classifier reads user-scope settings only; it ignores a
      # repository's own .claude/settings.json by design, so that a hostile
      # repo cannot grant itself permissions. The agent's HOME is therefore
      # the only place these rules take effect.
      - name: Install auto-mode rules
        run: |
          set -euo pipefail
          umask 077
          install -m 0600 .github/agent-host/settings.json "$AGENT_ROOT/home/.claude/settings.json"

      # Proves the token file parsed and the server accepted it, before any
      # session is started against it. `lode doctor` does a real whoami round
      # trip and exits non-zero on failure.
      - name: Preflight
        run: |
          set -euo pipefail
          HOME="$AGENT_ROOT/home" "$AGENT_ROOT/bin/lode" doctor

      # The primary clone owns .git and is never worked in: each worker gets
      # its own linked worktree off it (see reconcile.sh). Keeping it on main
      # is what makes it the checkout worktree.MainRoot resolves to, so the
      # repo-wide half of `lode install` lands here once rather than per agent.
      - name: Ensure the primary clone
        run: |
          set -euo pipefail
          repo="$AGENT_ROOT/repo"
          export HOME="$AGENT_ROOT/home"
          export PATH="$AGENT_ROOT/bin:$PATH"

          if [ ! -d "$repo/.git" ]; then
            git clone "${{ github.server_url }}/${{ github.repository }}.git" "$repo"
          fi
          git -C "$repo" fetch --prune origin

          # Only fast-forward a clean tree: a dirty primary is someone's
          # unfinished business. Worker output never lands here — it lives in
          # each agent worktree's own .worktrees/ on task branches.
          if [ -z "$(git -C "$repo" status --porcelain)" ]; then
            git -C "$repo" checkout main
            git -C "$repo" merge --ff-only origin/main
          else
            echo "::warning::$repo has local changes; leaving main where it is"
          fi

          claude plugin marketplace add "$repo" --scope local || true
          claude plugin install lode@worklode --scope local -y || true

      - name: Reconcile workers
        env:
          ONLY_WINDOW: ${{ inputs.window }}
          DUMP_SCROLLBACK: ${{ inputs.dump_scrollback }}
          RUN_ID: ${{ github.run_id }}
        run: .github/agent-host/reconcile.sh
