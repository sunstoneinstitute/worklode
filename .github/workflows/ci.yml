name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go cache paths
        id: go-cache
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # Restore on every run; only main writes the cache (see the save step below).
      # PRs read the shared cache but cannot poison it.
      - name: Restore Go cache
        id: go-cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: e2e smoke test
        run: go test -race -count=1 -tags e2e ./e2e/
      # Only main writes the cache, and only when go.sum changed (exact-key miss).
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        id: buildx
      # Persist the Dockerfile's Go cache mounts across runs. buildkit-cache-dance
      # extracts them into ./go-cache-mount, which actions/cache stores. Only main
      # writes (skip-extraction on PRs, and its post-save runs after extraction);
      # PRs read the shared cache without poisoning it.
      - name: Restore Go cache mounts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: go-cache-mount
          key: ${{ runner.os }}-docker-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-docker-go-
      - name: Inject Go cache into buildx
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "go-cache-mount/mod": "/go/pkg/mod",
              "go-cache-mount/build": "/root/.cache/go-build"
            }
          skip-extraction: ${{ github.ref != 'refs/heads/main' }}
      # Layer cache (type=gha) skips whole stages on unchanged source; the cache
      # mounts above fetch only the delta when go.sum changes.
      - name: docker build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          tags: work-tracker:ci
          push: false
          cache-from: type=gha,scope=docker
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=docker' || '' }}
