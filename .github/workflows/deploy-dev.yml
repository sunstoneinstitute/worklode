name: Deploy to dev

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build-image:
    uses: ./.github/workflows/_build-image.yml

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0

      - name: Update deploy branch
        uses: sunstoneinstitute/actions/update-deploy-branch@23d867008b2c88a200c6c64cd540cd6d31839518 # v1.7.0
        with:
          env: dev
          images: worklode
          registry: ghcr.io/sunstoneinstitute
          tag: ${{ needs.build-image.outputs.image-tag }}
          overlay-path: deploy/overlays/hzdev/kustomization.yaml

      - name: Output summary
        run: |
          {
            echo "### Deployment Summary"
            echo ""
            echo "**Environment:** dev (hzdev cluster)"
            echo "**Image tag:** \`${{ needs.build-image.outputs.image-tag }}\`"
            echo "**Deploy branch:** \`last-deploy/dev\`"
          } >> "$GITHUB_STEP_SUMMARY"
