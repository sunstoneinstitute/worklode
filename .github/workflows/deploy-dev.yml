name: Deploy to dev

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build-image:
    # A push to main has no fork head, so this is trusted by construction —
    # routing it to hel01 doesn't widen pr-checks.yml's `trusted` gate. It
    # lands on the caches the PR build of these same commits just warmed.
    uses: ./.github/workflows/_build-image.yml
    with:
      runs-on: '["docker","gha-buildcache"]'

  deploy:
    needs: build-image
    runs-on: ubuntu-26.04
    environment: dev
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0

      - name: Update deploy branch
        uses: sunstoneinstitute/actions/update-deploy-branch@3c3ceffadf24a8077738bf911173238bc4b9f554 # v1.10.0
        with:
          env: dev
          images: worklode
          registry: ghcr.io/sunstoneinstitute
          tag: ${{ needs.build-image.outputs.image-tag }}
          overlay-path: deploy/overlays/hzdev/kustomization.yaml

      - name: Output summary
        run: |
          {
            echo "### Deployment Summary"
            echo ""
            echo "**Environment:** dev (hzdev cluster)"
            echo "**Image tag:** \`${{ needs.build-image.outputs.image-tag }}\`"
            echo "**Deploy branch:** \`last-deploy/dev\`"
          } >> "$GITHUB_STEP_SUMMARY"
