name: Release

# Publishes a v* tag to the Homebrew tap.
#
# Tags pushed by "Promote to prod" use GITHUB_TOKEN, and pushes made with that
# token do not trigger workflows — so this file never fires for a promotion.
# promote-prod.yml runs the same tap update itself for that path. This workflow
# covers hand-pushed tags and manual re-runs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish (e.g. v0.1.3)
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-bottles:
    uses: ./.github/workflows/_build-bottles.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  homebrew:
    needs: build-bottles
    runs-on: ubuntu-latest
    # Resolves TAP_DEPLOY_KEY and gates it to the refs the environment's branch
    # policy allows. See the same job in promote-prod.yml for why the
    # environment sits here rather than behind a reusable workflow.
    environment: release
    timeout-minutes: 10
    steps:
      # The tap update is a local composite action, so the repo must be on disk
      # before it can be resolved.
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Update Homebrew tap
        uses: ./.github/actions/update-homebrew-tap
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          deploy-key: ${{ secrets.TAP_DEPLOY_KEY }}
          arm64-sequoia-sha: ${{ needs.build-bottles.outputs.arm64_sequoia_sha256 }}
          arm64-tahoe-sha: ${{ needs.build-bottles.outputs.arm64_tahoe_sha256 }}
          cellar: ${{ needs.build-bottles.outputs.cellar }}
