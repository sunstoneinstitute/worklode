name: Release

# Publishes a v* tag to the Homebrew tap.
#
# Tags pushed by "Promote to prod" use GITHUB_TOKEN, and pushes made with that
# token do not trigger workflows — so this file never fires for a promotion.
# promote-prod.yml calls _update-homebrew-tap.yml directly for that path. This
# workflow covers hand-pushed tags and manual re-runs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish (e.g. v0.1.3)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  homebrew:
    uses: ./.github/workflows/_update-homebrew-tap.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
