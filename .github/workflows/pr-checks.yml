name: PR Checks

on:
  pull_request:
    branches: [main]
    # `labeled` is included so that applying `can-be-tested` to a PR from an
    # outside contributor re-triggers the checks (the gate job below
    # re-evaluates and lets it through). opened/synchronize/reopened are the
    # normal triggers.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read
  # _build-image.yml declares packages: write; a called reusable workflow may
  # not request more than the caller grants, or GitHub fails the run at startup.
  packages: write

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Decide whether this PR may consume CI, keeping fork / drive-by PRs from
  # auto-running the build on a public repo. Docs-only PRs also skip; jobs
  # skipped via `if:` count as satisfied for branch protection.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether to run checks
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Opt-in label (needs Triage+, so authors cannot self-authorise).
          # Checked first so it also forces a run on a docs-only PR.
          if ${{ contains(github.event.pull_request.labels.*.name, 'can-be-tested') }}; then
            echo "PR carries the 'can-be-tested' label — running checks."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Docs/site-only skip. www/ is the static marketing site; it has its
          # own deploy workflow and shares no code with the Go build. On API
          # failure CHANGED is empty and we fall through to the trust checks —
          # failing open towards running.
          CHANGED=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' 2>/dev/null || true)
          if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qvE '(^docs/|^www/|\.md$)'; then
            echo "::notice::PR touches only docs/, www/ and markdown files — skipping the checks. Apply the 'can-be-tested' label to force a full run."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Not a fork — pushing the head branch required write access. Checked
          # before ASSOCIATION, which the webhook reports as CONTRIBUTOR for org
          # members whose membership is private.
          if [ "$HEAD_REPO" = "${{ github.repository }}" ]; then
            echo "PR head branch is in ${{ github.repository }} — running checks."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Author $AUTHOR is $ASSOCIATION — running checks."
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "::notice::PR is from a fork and author '$AUTHOR' ($ASSOCIATION) is not a member or collaborator, and the PR lacks the 'can-be-tested' label — skipping the checks. A maintainer can add that label to authorise CI."
          echo "run=false" >> "$GITHUB_OUTPUT"

  lint:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/_lint.yml

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/_test.yml

  build-image:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      push: false

  validate-kustomize:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Needs flat-overlay support (actions v1.6.0+); without it this step
      # validates zero overlays against this repo's flat
      # deploy/overlays/<env>/kustomization.yaml layout and reports success
      # having checked nothing.
      - uses: sunstoneinstitute/actions/validate-kustomize@23d867008b2c88a200c6c64cd540cd6d31839518 # v1.7.0
        with:
          overlay-base: deploy/overlays
          environments: hzdev hzprod
